<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"></html>
<head>
    <meta charset="UTF-8">
    <title>MoodBloom Journal</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/journal.css">
</head>
<body>
    <div th:replace="~{nav_bar :: navbar}"></div>

<div class="journal-container">

    <h1>MoodBloom Journal</h1>

    <div class="journal-layout">

        <!-- Sidebar -->

        <aside class="journal-sidebar">

            <h2>Previous Entries</h2>

            <div class="entry-preview">

                <h3>Title</h3>
                <p>June 17, 2026</p>

            </div>

            <div class="entry-preview">

                <h3>Title</h3>
                <p>June 16, 2026</p>

            </div>

            <div class="entry-preview">

                <h3>Title</h3>
                <p>June 15, 2026</p>

            </div>

            <div class="entry-preview">

                <h3>Title</h3>
                <p>June 14, 2026</p>

            </div>

        </aside>

        <!-- Main Journal Area -->

        <main class="journal-card">

            <p class="journal-date">
                June 18, 2026
            </p>

            <div class="journal-paper">

                <input
                    type="text"
                    class="journal-title"
                    placeholder="Untitled Entry">

                <textarea
                    class="journal-entry"
                    placeholder="How are you feeling today?"></textarea>

            </div>

            <div class="journal-navigation">

                <button class="nav-btn">
                    ← Previous Entry
                </button>

                <button class="nav-btn">
                    Next Entry →
                </button>

            </div>

            <button class="save-btn">
                Save Entry
            </button>

        </main>

    </div>

</div>

</body>
</html>
