<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom Journal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/journal.css">
</head>

<body>

<div th:replace="~{nav_bar :: navbar}"></div>

<div class="journal-container">

    <h1>MoodBloom Journal</h1>

    <div class="journal-layout">

        <!-- Sidebar -->

        <aside class="journal-sidebar">

            <h2>Previous Entries</h2>

            <div
                    th:each="entry : ${entries}"
                    class="entry-preview">

                <a th:href="@{/journal(entryId=${entry.id})}"
                   class="entry-link">

                    <h3 th:text="${entry.title}">Title</h3>

                    <p th:text="${entry.entryDate}">
                        Date
                    </p>

                </a>

            </div>

        </aside>

        <!-- Main Journal Area -->

        <main class="journal-card">

            <p class="journal-date"
               th:text="${currentEntry.entryDate}">
                Date
            </p>

            <form action="/journal/save" method="post">

                <div class="journal-paper">

                    <input
                            type="text"
                            name="title"
                            class="journal-title"
                            placeholder="Untitled Entry"
                            th:value="${currentEntry.title}">

                    <textarea
                            name="content"
                            class="journal-entry"
                            placeholder="How are you feeling today?"
                            th:text="${currentEntry.content}"></textarea>

                </div>

                <div class="journal-navigation">

                    <button
                            type="button"
                            class="nav-btn">
                        ← Previous Entry
                    </button>

                    <button
                            type="button"
                            class="nav-btn">
                        Next Entry →
                    </button>

                </div>

                <button
                        type="submit"
                        class="save-btn">
                    Save Entry
                </button>

            </form>

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
