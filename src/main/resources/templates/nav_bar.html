<!DOCTYPE html>
<html lang="en" 
xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="navbar" th:fragment="navbar">
    <div class="navbar__brand">
        <span>
            <img th:src="@{/images/MoodBloomLogo_cropped.png}" alt="MoodBloom Logo" />
        </span>
        <div>
            MoodBloom
            <div style="font-size:0.8rem; font-weight:400; opacity:0.85;">
                Grow your mood
            </div>
        </div>
    </div>

    <nav>
        <ul class="navbar__links">
            <li><a th:href="@{/journal}">Journal</a></li>
            <li><a th:href="@{/mood_tracker}">Mood Tracking</a></li>
            <li><a th:href="@{/community}">Community</a></li>
            <li><a th:href="@{/profile}">Profile</a></li>
            <li><a th:href="@{/resources}">Resources</a></li>
        </ul>
    </nav>

     <!-- Show Login when NOT logged in -->
<a th:href="@{/login}"
   class="navbar__cta"
   sec:authorize="isAnonymous()">
    Login
</a>

<!--Show username dropdown when logged in -->
<div class="navbar__user dropdown" sec:authorize="isAuthenticated()">
    <a class="navbar__cta dropdown-toggle"
       href="#"
       id="userDropdown"
       data-bs-toggle="dropdown"
       aria-expanded="false">
        <span sec:authentication="name"></span>
    </a>

    <ul class="dropdown-menu dropdown-menu-end">
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item">
                    Logout
                </button>
            </form>
        </li>
    </ul>
</div>

</header>

</body>
</html>
