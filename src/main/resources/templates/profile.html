<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/profile.css">
</head>

<body>

    <div th:replace="~{nav_bar :: navbar}"></div>

    <main class="profile-page">

        <form class="profile-form" action="/profile" method="post">

            <h1>Update User Profile</h1>

            <div class="error-box" th:if="${error != null}">
                <p th:text="${error}"></p>
            </div>

            <div class="form-row">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" th:value="${username}">
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:value="${email}">
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-row">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
            </div>

            <button type="submit">Update Profile</button>

        </form>

    </main>

</body>

</html>

       
      

    </main>

</body>
</html>
