<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/profile.css">
</head>

<body>

    <!-- Nav bar -->
    <div th:replace="~{nav_bar :: navbar}"></div>

    <main class="profile-page">

    <div class="profile-main-card">

        <!-- Top profile display card -->
        <div class="user-info-card">

            <!-- Left side: card image -->
            <div class="profile-image-side">
                <img src="/images/moodbloom_user_card_icon.png" 
                     alt="profile icon" 
                     class="profile-icon">
            </div>

            <!-- Right side: user details -->
            <div class="profile-details-side">

                <h3 sec:authentication="name">anonymousUser</h3>

                <div class="user-stats-row">
                    <p>
                        <span>Date Joined:</span>
                        <br>
                        <span th:text="${dateJoined}">null</span>
                    </p>

                    <p>
                        <span>Posts:</span>
                        <br>
                       <span th:text="${postTotal}"></span>
                    </p>
                </div>

                <div class="user-stats-row">
                    <p>
                        <span>Journal Entries:</span>
                        <br>
                        <span th:text="${journalTotal}">null</span>
                    </p>

                    <p>
                        <span>Mood Entries:</span>
                        <br>
                        <span th:text="${moodTotal}"></span>
                    </p>
                </div>

            </div>

        </div>

        <!-- Form stays underneath -->
        <form class="profile-form" action="/profile" method="post">

            <h1>Update User Profile</h1>

            <div class="error-box" th:if="${error != null}">
                <p th:text="${error}"></p>
            </div>

            <div class="alert alert-success" th:if="${success != null}">
                <p th:text="${success}"></p>
            </div>

            <div class="form-row">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" th:value="${username}">
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:value="${email}">
            </div>

            <div class="form-row">
                <label for="password">Change Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-row">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
            </div>

        </form>

        
            <!-- Buttons are outside the update form -->
            <div class="profile-action-buttons">

                <!-- This button submits profile-update-form -->
                <button type="submit"
                        form="profile-update-form"
                        class="update-profile-button">

                    Update Profile

                </button>


                <!-- Delete account uses its own form -->
                <form th:action="@{/profile/delete}"
                      method="post"
                      class="delete-account-form"
                      onsubmit="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">

                    <button type="submit"
                            class="delete-account-button">

                        Delete Account

                    </button>

                </form>

            </div>

        </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
