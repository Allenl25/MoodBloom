<!DOCTYPE html>

<!-- This lets Thymeleaf show backend error messages on this page -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>

    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="registration-page">

        <!-- registration form -->
       <form class="registration-form" action="/register" method="post">

        <!-- Logo -->

        <img src="/images/MoodBloomLogo2.png" alt="MoodBloom logo" class="registration-logo">

        <h1>Register Account</h1>

        <!-- This error box only appears if the backend sends an error message -->

    
        <div class="error-box" th:if="${error}">
        <p th:text="${error}"></p>
        </div>


        <!-- Textboxes Username,Email,Password, Confirm Password, Guidelines/Privacy Policies -->
    <div class="form-row">
        <label for="username">Username:</label>
        <input type="text" id="username" th:value="${username}" name="username">
    </div>



    <div class="form-row">
        <label for="email">Email:</label>
        <input type="text" id="email" th:value="${email}" name="email">
    </div>



    <div class="form-row">
        <label for="password">Password:</label>
        <input type="text" id="password" name="password" th:value="${password}">
    </div>



    <div class="form-row">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="text" id="confirmPassword" name="confirmPassword" th:value="${confirmPassword}">
    </div>



    <div class="checkbox-row">
    <!-- community guidelines checkbox -->
    
        <input type="checkbox" id= "guidelines" name="guidelines" th:checked="${guidelines != null}">
        <div class="policy-link">
             
             <a href="/guidelines">Website Guidelines</a>
        </div> 

    


    <!-- privacy policy checkbox -->

    
    
        <input type="checkbox" id="privacy" name="privacy" th:checked="${privacy != null}">
        
        <div class="policy-link">
             <a href="/policy">Privacy Policy</a>
        </div>
       
    


    </div>

       
    <!-- submit registration info button -->
    <div class="registration-buttons">
    <a class="registration-link" href="/login">Back</a>
    <button type="submit" class="registration-submit">Register</button>

     </div>

    

     

</form>
       
        

       
      

    </main>

</body>
</html>
