<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" th:href="@{/well_pop.css}">
</head>

<body>
    <div th:replace="~{nav_bar :: navbar}"></div>

    <main class="container mt-5">

        <h1 class="text-center mood-title">
            Daily Mood Tracker
        </h1>

        <section class="text-center">

            <h3 class="mood-subtitle">
                How are you feeling today?
            </h3>

            <div class="mood-options">

                <button class="mood-btn happy" data-mood="happy">😊<br>Happy</button>
                <button class="mood-btn calm" data-mood="calm">😌<br>Calm</button>
                <button class="mood-btn excited" data-mood="excited">🤩<br>Excited</button>
                <button class="mood-btn motivated" data-mood="motivated">💪<br>Motivated</button>
                <button class="mood-btn neutral" data-mood="neutral">😐<br>Neutral</button>
                <button class="mood-btn tired" data-mood="tired">😴<br>Tired</button>
                <button class="mood-btn sad" data-mood="sad">😢<br>Sad</button>
                <button class="mood-btn stressed" data-mood="stressed">😣<br>Stressed</button>
                <button class="mood-btn angry" data-mood="angry">😠<br>Angry</button>
                <button class="mood-btn grateful" data-mood="grateful">🙏<br>Grateful</button>

            </div>

        </section>

        <section class="mt-4">
            <label for="notes" class="form-label mood-label">
                Add a note (optional)
            </label>
            <textarea id="notes" class="form-control mood-notes" rows="4" placeholder="Write about your day..."></textarea>
        </section>

        <div class="text-center mt-4">
            <button class="primary-btn mood-save-btn">
                Save Mood
            </button>
        </div>

        <section class="mt-5">
            <h3 class="recent-title">Recent Entries</h3>

            <th:block th:with="
                icons=${new java.util.HashMap()},
                _=${icons.put('happy','😊')},
                _=${icons.put('calm','😌')},
                _=${icons.put('excited','🤩')},
                _=${icons.put('motivated','💪')},
                _=${icons.put('neutral','😐')},
                _=${icons.put('tired','😴')},
                _=${icons.put('sad','😢')},
                _=${icons.put('stressed','😣')},
                _=${icons.put('angry','😠')},
                _=${icons.put('grateful','🙏')}
            ">
                <div class="recent-moods">
                    <div th:each="entry : ${moodEntries}" class="mood-entry d-flex align-items-start justify-content-between">
                        <span class="mood-icon" th:text="${icons[entry.mood]}"></span>
                        <div class="flex-grow-1 ms-3">
                            <span class="mood-date"
                                th:text="${#temporals.format(entry.createdAt, 'MMMM dd, yyyy')}"></span>
                            <br>
                            <span class="mood-note" th:text="${entry.note}"></span>
                        </div>
                        <button class="mood-edit-btn"
                            th:attr="data-id=${entry.id}, data-mood=${entry.mood}, data-note=${entry.note}">
                            Edit
                        </button>
                        <button class="mood-delete-btn"
                            th:attr="data-id=${entry.id}">
                            Delete
                        </button>
                    </div>
                </div>
            </th:block>
        </section>

        <div id="editModal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <h4>Edit Mood Entry</h4>

                <input type="hidden" id="editEntryId">

                <label class="form-label mt-2">Mood</label>
                <select id="editMood" class="mood-edit-select">
                    <option value="happy">😊 Happy</option>
                    <option value="calm">😌 Calm</option>
                    <option value="excited">🤩 Excited</option>
                    <option value="motivated">💪 Motivated</option>
                    <option value="neutral">😐 Neutral</option>
                    <option value="tired">😴 Tired</option>
                    <option value="sad">😢 Sad</option>
                    <option value="stressed">😣 Stressed</option>
                    <option value="angry">😠 Angry</option>
                    <option value="grateful">🙏 Grateful</option>
                </select>

                <label class="form-label mt-3">Notes</label>
                <textarea id="editNotes" class="mood-edit-textarea" rows="3"></textarea>

                <button id="saveEditBtn" class="mood-save-edit-btn mt-3 w-100">
                    Save Changes
                </button>

                <button id="closeEditBtn" class="mood-cancel-btn mt-2 w-100">
                    Cancel
                </button>
            </div>
        </div>

        <div id="moodDeleteModal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <h4>Delete Mood Entry?</h4>
                <p>This will remove the entry from your history.</p>

                <input type="hidden" id="moodDeleteEntryId">

                <button id="confirmDeleteBtn" class="mood-confirm-delete-btn w-100 mt-3">
                    Yes, Delete
                </button>

                <button id="cancelDeleteBtn" class="mood-cancel-btn w-100 mt-2">
                    Cancel
                </button>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascript/mood_tracker.js"></script>


    <!-- wellness pop-up fragment -->
        <div th:replace="~{well_pop :: well_frag}"></div>
</body>
</html>
